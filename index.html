<!DOCTYPE html>
<html lang="ja">
  <head>
    <script src="/_vercel/insights/script.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Pass App</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Meal Pass App</h1>

      <!-- 1. フィルタ (市販弁当なし) -->
      <div class="filter-section">
        <div class="filter-title">
          <i class="fas fa-sliders-h"></i> カテゴリ設定
        </div>
        <div class="filter-grid">
          <label class="filter-checkbox"
            ><input type="checkbox" id="filter-bento" checked /> 🍱
            内製弁当</label
          >
          <label class="filter-checkbox"
            ><input type="checkbox" id="filter-onigiri" checked /> 🍙
            おにぎり</label
          >
          <label class="filter-checkbox"
            ><input type="checkbox" id="filter-bread" checked /> 🍞
            パン類</label
          >
          <label class="filter-checkbox"
            ><input type="checkbox" id="filter-cupmen" checked /> 🍜
            カップ麺</label
          >
          <label class="filter-checkbox"
            ><input type="checkbox" id="filter-drink" checked /> 🥤
            飲み物</label
          >
          <label class="filter-checkbox"
            ><input type="checkbox" id="filter-salad" checked /> 🥗
            サラダ</label
          >
        </div>
      </div>

      <!-- 2. 入力欄 + 検索ボタン -->
      <div class="input-group">
        <span class="input-label">残高:</span>
        <input
          type="number"
          id="balanceInput"
          class="input-field"
          placeholder="例: 550"
        />
        <button id="searchBtn" class="btn-icon">
          <i class="fas fa-search"></i>
        </button>
      </div>

      <!-- 3. リセットボタン -->
      <div class="reset-link-container">
        <button id="resetExcludedButton">
          <i class="fas fa-undo"></i> 除外をリセット
        </button>
      </div>

      <!-- 4. 結果 -->
      <div id="resultArea" class="result-area"></div>
      <footer
        style="
          margin-top: 40px;
          color: #aaa;
          font-size: 0.8rem;
          text-align: center;
        "
      >
        @naoto
      </footer>
    </div>

    <!-- モジュールとして読み込み -->
    <script type="module" src="app.js"></script>
  </body>
</html>
