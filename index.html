<!DOCTYPE html>
<html lang="ja">
  <head>
    <script src="/_vercel/insights/script.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Pass App</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="logo-text">Meal Pass</div>
        <div class="sub-text">ver 1.2.0-beta</div>
      </header>

      <div class="budget-card">
        <div class="budget-label">BUDGET LIMIT</div>
        <div class="budget-row">
          <div class="currency-symbol">¥</div>
          <input
            type="number"
            id="balanceInput"
            class="balance-input-large"
            placeholder="550"
            value="550"
            step="10"
          />
          <button id="searchBtn" class="btn-propose">
            <i class="fas fa-search"></i> おすすめ検索
          </button>
        </div>
      </div>

      <div class="filter-scroll-area">
        <button class="filter-pill active" data-target="filter-bento">
          <i class="fas fa-utensils"></i> 内製弁当
        </button>
        <button class="filter-pill active" data-target="filter-onigiri">
          🍙 おにぎり
        </button>
        <button class="filter-pill active" data-target="filter-bread">
          <i class="fas fa-bread-slice"></i> パン類
        </button>
        <button class="filter-pill active" data-target="filter-cupmen">
          🍜 カップ麺
        </button>
        <button class="filter-pill active" data-target="filter-drink">
          <i class="fas fa-glass-whiskey"></i> 飲み物
        </button>
        <button class="filter-pill active" data-target="filter-salad">
          <i class="fas fa-leaf"></i> サラダ
        </button>
      </div>

      <div style="display: none">
        <input type="checkbox" id="filter-bento" checked />
        <input type="checkbox" id="filter-onigiri" checked />
        <input type="checkbox" id="filter-bread" checked />
        <input type="checkbox" id="filter-cupmen" checked />
        <input type="checkbox" id="filter-drink" checked />
        <input type="checkbox" id="filter-salad" checked />
      </div>

      <div class="list-header-row">
        <h3>おすすめ商品</h3>
        <button id="resetExcludedButton" class="reset-link">
          すべてリセット
        </button>
      </div>

      <div id="resultArea" class="result-area">
        <div class="empty-state">
          「提案」ボタンを押して<br />ランチを決めましょう！
        </div>
      </div>

      <div class="retry-container">
        <button id="retrySearchBtn" class="btn-retry">
          <i class="fas fa-redo"></i> 条件を変更して再検索
        </button>
      </div>

      <div style="height: 100px"></div>
    </div>

    <div class="fixed-footer">
      <div id="footerStatus" class="footer-status"></div>
      <div class="footer-row">
        <div class="total-info">
          <div class="label">合計金額</div>
          <div class="value" id="footerTotal">¥ 0</div>
        </div>
        <div class="divider"></div>
        <div class="remain-info">
          <div class="label">残高</div>
          <div class="value" id="footerRemain">¥ 0</div>
        </div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
