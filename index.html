<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Meal Pass App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <div class="logo-text">Meal Pass</div>
        <div class="sub-text">ver 2.1.0-beta @naot0</div>
      </header>

      <div class="budget-card">
        <div class="budget-label">ミールの残高を入力！</div>
        <div class="budget-row">
          <div class="currency-symbol">¥</div>
          <input
            type="number"
            id="balanceInput"
            class="balance-input-large"
            placeholder="550"
            step="10"
          />
          <button id="searchBtn" class="btn-propose">
            <i class="fas fa-search"></i> 検索
          </button>
        </div>

        <div style="margin-top: 15px; text-align: center">
          <button
            id="scanBtn"
            class="btn-retry"
            style="max-width: 200px; font-size: 0.9rem"
          >
            <i class="fas fa-barcode"></i> 商品をスキャン
          </button>
        </div>

        <div
          id="scannerContainer"
          style="
            display: none;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
          "
        >
          <p style="font-size: 0.8rem; color: #666; margin-bottom: 5px">
            バーコードをカメラに向けてください
          </p>

          <div
            style="
              position: relative;
              width: 100%;
              max-width: 240px; /* 横幅 */
              height: 150px; /* ★縦幅を150pxに固定 */
              margin: 0 auto;
              overflow: hidden;
              border-radius: 8px;
              background: #000;
            "
          >
            <video
              id="video"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover; /* ★枠に合わせて映像をトリミング（拡大して埋める） */
              "
            ></video>
          </div>

          <button
            id="stopScanBtn"
            class="reset-link"
            style="margin-top: 10px; font-size: 0.9rem"
          >
            スキャンをキャンセル
          </button>
        </div>
      </div>

      <div class="filter-scroll-area">
        <button class="filter-pill active" data-target="filter-bento">
          <i class="fas fa-utensils"></i> 内製弁当
        </button>
        <button class="filter-pill active" data-target="filter-onigiri">
          🍙 おにぎり
        </button>
        <button class="filter-pill active" data-target="filter-bread">
          <i class="fas fa-bread-slice"></i> パン類
        </button>
        <button class="filter-pill active" data-target="filter-cupmen">
          🍜 カップ麺
        </button>
        <button class="filter-pill active" data-target="filter-drink">
          <i class="fas fa-glass-whiskey"></i> 飲み物
        </button>
        <button class="filter-pill active" data-target="filter-salad">
          <i class="fas fa-leaf"></i> サラダ
        </button>
      </div>

      <div style="display: none">
        <input type="checkbox" id="filter-bento" checked />
        <input type="checkbox" id="filter-onigiri" checked />
        <input type="checkbox" id="filter-bread" checked />
        <input type="checkbox" id="filter-cupmen" checked />
        <input type="checkbox" id="filter-drink" checked />
        <input type="checkbox" id="filter-salad" checked />
      </div>

      <div class="list-header-row">
        <h3>おすすめ商品</h3>
        <button id="resetExcludedButton" class="reset-link">
          すべてリセット
        </button>
      </div>

      <div id="resultArea" class="result-area">
        <div class="empty-state">
          「提案」ボタンを押して<br />ランチを決めましょう！
        </div>
      </div>

      <div class="retry-container">
        <button id="retrySearchBtn" class="btn-retry">
          <i class="fas fa-redo"></i> 条件を変更して再検索
        </button>
      </div>

      <div style="height: 100px"></div>
    </div>

    <div class="fixed-footer">
      <div id="footerStatus" class="footer-status"></div>
      <div class="footer-row">
        <div class="total-info">
          <div class="label">合計金額</div>
          <div class="value" id="footerTotal">¥ 0</div>
        </div>
        <div class="divider"></div>
        <div class="remain-info">
          <div class="label">残高</div>
          <div class="value" id="footerRemain">¥ 0</div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope
              );
            })
            .catch((err) => {
              console.log("ServiceWorker registration failed: ", err);
            });
        });
      }
    </script>
  </body>
</html>
